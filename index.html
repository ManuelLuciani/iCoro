<script>
(function(){
'use strict';
/* ---------- accordi ---------- */
const IT=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const ITb=['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];

const ROOT={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11,DO:0,RE:2,MI:4,FA:5,SOL:7,LA:9,SI:11,C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const R='(?:SOL|Sol|SI|Si|DO|Do|RE|Re|MI|Mi|FA|Fa|LA|La|[A-G])';
const CH=new RegExp('^('+R+')([#b♯♭]?)((?:maj|min|dim|aug|sus|add|m|M|\\+|-|°|ø|\\d|[#b]|\\(|\\))*)(?:/('+R+')([#b♯♭]?))?$');

const TIPI={messa:'Messa',standard:'Scaletta standard'};
const capoHTML=n=>n>0?'<div class="capo">Capotasto al '+n+'° tasto</div>':'';
function parseChord(s){const m=CH.exec(s);if(!m)return null;
  const acc=x=>x==='#'||x==='♯'?1:(x==='b'||x==='♭'?-1:0);
  return{root:m[1],acc:acc(m[2]),suffix:m[3]||'',bass:m[4]||null,bacc:acc(m[5]||''),sys:/^(SOL|Sol|SI|Si|DO|Do|RE|Re|MI|Mi|FA|Fa|LA|La)$/.test(m[1])?'it':'en'};}
function idxOf(root,acc){return((ROOT[root]+acc)%12+12)%12}
function isMinor(p){return /^(m(?!aj)|min|-)/.test(p.suffix)}
function keyIndex(chord){const p=parseChord(chord);if(!p)return null;let i=idxOf(p.root,p.acc);return isMinor(p)?(i+3)%12:i}
function nameFor(i,sys,flats){return(sys==='it'?IT:EN)[((i%12)+12)%12]}
function shiftChord(str,n,sys,flats){const p=parseChord(str);if(!p)return str;
  let out=nameFor(idxOf(p.root,p.acc)+n,sys,flats)+p.suffix;
  if(p.bass)out+='/'+nameFor(idxOf(p.bass,p.bacc)+n,sys,flats);return out}
function firstChord(body){const re=/\[([^\]]+)\]/g;let m;while((m=re.exec(body))){if(parseChord(m[1].trim()))return m[1].trim()}return null}
function songSys(body){const c=firstChord(body);const p=c&&parseChord(c);return p?p.sys:'it'}
const TOKRE=/^(\(?)(.+?)([)….,]*)$/;
function tokInfo(x){const m=TOKRE.exec(x);if(!m||!CH.test(m[2]))return null;return{pre:m[1],core:m[2],post:m[3]}}
function isChordLine(l){if(!l.trim()||l.includes('['))return false;
  let t=l.trim().split(/\s+/);if(t.length>1&&/^[A-Za-zÀ-ÿ]+:$/.test(t[0]))t=t.slice(1);
  t=t.filter(x=>!/^[\/|]+$/.test(x));if(!t.length)return false;
  const ti=t.map(tokInfo);if(!ti.every(Boolean))return false;
  if(t.length>1)return true;const x=ti[0].core;return /[#b\d\/m\-+]/.test(x.slice(1))||/^[A-G]$/.test(x)&&x!=='E'||x.length>3}
const wrapTok=x=>{const i=tokInfo(x);return i?i.pre+'['+i.core+']'+i.post:x};
function normalizeBody(txt){const L=String(txt).replace(/\r/g,'').split('\n'),out=[];
  for(let i=0;i<L.length;i++){const l=L[i];
    if(isChordLine(l)){const toks=[...l.matchAll(/\S+/g)].filter(m=>tokInfo(m[0]));const nx=L[i+1];
      if(nx!==undefined&&nx.trim()&&!isChordLine(nx)&&!nx.includes('[')&&!/^\s*#/.test(nx)){
        let s=nx;for(let k=toks.length-1;k>=0;k--){const pos=toks[k].index;if(s.length<pos)s=s.padEnd(pos,' ');s=s.slice(0,pos)+wrapTok(toks[k][0])+s.slice(pos)}
        out.push(s);i++;continue}
      out.push(l.trim().replace(/\s+/g,' ').replace(/\S+/g,wrapTok));continue}
    out.push(l)}
  return out.join('\n')}
/* tonalità mostrata dopo la trasposizione */
function keyLabel(song,n,pref){const c=firstChord(song.body);if(!c)return song.key||'';
  const sys=pref==='auto'?songSys(song.body):pref;const ki=keyIndex(c);
  const flats=FLATKEYS.includes((ki+n+120)%12);return shiftChord(c,n,sys,flats)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sheetHTML(song,n,pref){
  const first=firstChord(song.body);const sys=pref==='auto'?songSys(song.body):pref;
  const ki=first?keyIndex(first):0;const flats=FLATKEYS.includes((ki+n+120)%12);
  const lines=String(song.body||'').replace(/\r/g,'').split('\n');
  return lines.map(line=>{
    if(/^\s*#/.test(line))return'<div class="sec">'+esc(line.replace(/^\s*#+\s*/,''))+'</div>';
    if(!line.trim())return'<div class="gap"></div>';
    const re=/\[([^\]]*)\]/g;const segs=[];let last=0,m,cur={c:'',t:''};
    while((m=re.exec(line))){cur.t=line.slice(last,m.index);segs.push(cur);cur={c:m[1].trim(),t:''};last=m.index+m[0].length}
    cur.t=line.slice(last);segs.push(cur);
    if(segs.length===1&&!segs[0].c)return'<div class="ln plain">'+esc(line)+'</div>';
    return'<div class="ln">'+segs.filter((s,i)=>s.c||s.t||i===0&&segs.length===1).map(s=>{
      const c=s.c?esc(shiftChord(s.c,n,sys,flats)):'';
      return'<span class="sg"><span class="ch">'+(c||'&nbsp;')+'</span><span class="tx">'+(esc(s.t)||(s.c?'&nbsp;':''))+'</span></span>'}).join('')+'</div>'
  }).join('')}

async function shrink(file){const bmp=await createImageBitmap(file);const k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const b64=blob=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(blob)});
const GAPI='https://generativelanguage.googleapis.com/v1beta/';
async function listModels(key,force){
  let m=!force&&LS.get('gmodels',null);if(m&&m.length)return m;
  const r=await fetch(GAPI+'models?pageSize=200&key='+encodeURIComponent(key));
  if(!r.ok){throw await apiErr(r)}
  const list=((await r.json()).models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')&&/gemini-[\d.]+-flash/.test(x.name)&&!/lite|image|tts|live|audio|thinking|exp|8b|robotics|computer/.test(x.name));
  if(!list.length){const e=new Error('Nessun modello Gemini Flash disponibile con questa chiave');e.detail=e.message;throw e}
  const ver=x=>parseFloat((/gemini-([\d.]+)-flash/.exec(x.name)||[0,0])[1]);
  list.sort((a,b)=>ver(b)-ver(a)||(/preview/.test(a.name)-/preview/.test(b.name)));
  m=list.map(x=>x.name.replace(/^models\//,'')).slice(0,4);LS.set('gmodels',m);return m}
async function apiErr(r){let msg='';try{const j=await r.json();msg=(j.error&&j.error.message)||''}catch(e){}
  const e=new Error('http '+r.status);e.status=r.status;e.detail='Errore '+r.status+(msg?': '+msg.slice(0,160):'');return e}
async function gemini(key,parts,signal){
  let last=null;
  for(let round=0;round<2;round++){
    const models=await listModels(key,round>0);
    for(const model of models.slice(0,3)){
      try{
        const r=await fetch(GAPI+'models/'+model+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0,responseMimeType:'application/json'}})});
        if(!r.ok){const e=await apiErr(r);if([400,401,403,429].includes(e.status))throw e;last=e;continue}
        const j=await r.json();const c=(j.candidates||[])[0];const t=c&&c.content&&c.content.parts;
        const txt=t?t.map(p=>p.text||'').join('').trim():'';
        if(!txt){last=new Error('vuota');last.detail='Risposta vuota ('+((c&&c.finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||'nessun motivo')+') dal modello '+model;continue}
        return txt
      }catch(e){if(e.name==='AbortError'||e.status)throw e;last=e;last.detail=last.detail||'Connessione non riuscita: '+(e.message||e)}
    }
    LS.set('gmodels',null)}
  throw last||new Error('sconosciuto')}
function placeChords(text,list){
  const base=text.toLowerCase();const ins=[];
  for(const c of list||[]){const a=String(c.a||'').trim();if(!a)continue;const pre=String(c.prima||'');let pos=-1;
    if(!pre)pos=0;
    else if(base.startsWith(pre.toLowerCase()))pos=pre.length;
    else{ // ripiego: ultima parola di "prima" cercata nel testo, altrimenti proporzione
      const w=pre.trim().split(/\s+/).pop().toLowerCase();const i=w?base.indexOf(w):-1;
      pos=i>=0?i+w.length:Math.min(text.length,pre.length)}
    ins.push({pos,a})}
  ins.sort((x,y)=>y.pos-x.pos);let out=text;
  for(const x of ins){const m=/^\((.*)\)$/.exec(x.a);const ch=m?'(['+m[1]+'])':'['+x.a+']';out=out.slice(0,x.pos)+ch+out.slice(x.pos)}
  return out}
function buildFromJSON(raw){
  let j;try{j=JSON.parse(raw)}catch(e){const m=/\{[\s\S]*\}/.exec(raw);if(!m)throw Object.assign(new Error('json'),{detail:'La risposta non è nel formato atteso'});j=JSON.parse(m[0])}
  const out=[];
  for(const r of j.righe||[]){
    if(r.t==='vuota')out.push('');
    else if(r.t==='nota')out.push(r.testo||'');
    else if(r.t==='sezione')out.push('# '+String(r.testo||'').replace(/^#\s*/,'').replace(/:$/,''));
    else if(r.t==='accordi')out.push(String(r.testo||'').trim().replace(/\S+/g,wrapTok));
    else out.push(placeChords(String(r.testo||''),r.accordi))}
  return{title:String(j.titolo||'').trim(),author:String(j.autore||'').trim(),body:out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}}
async function fromPhotos(files){
  const key=LS.get('gkey','');
  if(!key){toast('Prima inserisci la chiave Gemini nelle Impostazioni');settings();return}
  modal('Sto leggendo la pagina','<div class="ring"><div class="wrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="pfg" cx="60" cy="60" r="52"/></svg><span class="pc" id="ppc" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</span></div><div class="st" id="pst">Preparo le foto</div><div class="pbar" aria-hidden="true"><i id="pbr"></i></div><p class="hint" style="text-align:center;margin:0">La percentuale è una stima: dipende dalla velocità di Google.</p></div>','<button class="btn" id="pabort">Annulla</button>');
  let pv=0,tick=null;const prog=(p,l)=>{pv=Math.max(pv,Math.min(100,p));const r=Math.round(pv);const f=$('#pfg');if(!f)return;f.style.strokeDashoffset=(326.7*(1-pv/100)).toFixed(1);$('#ppc').textContent=r+'%';$('#ppc').setAttribute('aria-valuenow',r);$('#pbr').style.width=pv+'%';if(l)$('#pst').textContent=l};
  const ac=new AbortController();$('#pabort').onclick=()=>{ac.abort();clearInterval(tick);closeModal()};
  try{
    const parts=[];
    const prompt='Ti allego la foto di una o più pagine di un libro di canti per la chiesa, con testo e accordi (stampato o scritto a mano). Trascrivi il primo canto come JSON, senza altro testo.\nFormato: {"titolo":"...","autore":"...","righe":[ ... ]}. Ogni elemento di "righe" è uno di questi, nell’ordine della pagina:\n- {"t":"nota","testo":"..."} per righe come il tempo o la tonalità sotto il titolo (es. 6/8 - Largo in Re Maggiore);\n- {"t":"sezione","testo":"..."} per etichette come Strofa, Ritornello, Strumentale, quando sono su una riga a sé senza accordi;\n- {"t":"accordi","testo":"RE / SOL / SI- / LA4"} per righe di soli accordi (intro, strumentale, anche se hanno un’etichetta davanti: in quel caso usa {"t":"accordi","testo":"INTRO: RE / SOL"}); copia gli accordi e i separatori esattamente come nel libro, anche in maiuscolo;\n- {"t":"testo","testo":"<riga di parole>","accordi":[{"a":"RE","prima":"<parole che precedono l’accordo>"}]} per ogni riga di parole;\n- {"t":"vuota"} per una riga vuota tra le strofe.\nCome si compilano gli accordi di una riga di parole: ogni accordo è scritto sopra la riga, esattamente sopra una lettera. In "prima" scrivi, carattere per carattere uguale a "testo", tutto il testo della riga che sta a SINISTRA di quella lettera, cioè le lettere che precedono il punto in cui comincia l’accordo (stringa vuota se l’accordo è sopra la prima lettera). Se l’accordo cade a metà di una parola, "prima" finisce a metà di quella parola, sulla sillaba giusta. Guarda con cura la posizione orizzontale di ogni accordo rispetto alle lettere sotto di lui. Elenca gli accordi della riga da sinistra a destra. Un accordo tra parentesi nel libro, come (RE), va scritto con le parentesi in "a". Copia gli accordi come scritti (RE, SOL, SI-, LA4, Do, Lam, C, Am).\nCopia le parole fedelmente, con maiuscole e minuscole normali di una frase. Non inventare e non correggere nulla: dove una parola o un accordo non è leggibile scrivi [?] al suo posto. Se nella foto c’è più di un canto, trascrivi solo il primo.';
    parts.push({text:prompt});
    const fl=[...files].slice(0,3);let fi=0;
    for(const f of fl){prog(2+13*fi/fl.length,'Preparo la foto '+(fi+1)+' di '+fl.length);fi++;let bl;try{bl=await shrink(f)}catch(er){const x=new Error('foto');x.detail='Non riesco ad aprire la foto ('+(f.type||'formato sconosciuto')+'). Prova a scattarla di nuovo o a scegliere un JPEG.';throw x}parts.push({inline_data:{mime_type:'image/jpeg',data:await b64(bl)}})}
    prog(15,'Gemini sta leggendo testo e accordi');const t0=Date.now();
    tick=setInterval(()=>{const sec=(Date.now()-t0)/1000;prog(15+72*(1-Math.exp(-sec/18)))},250);
    const t=await gemini(key,parts,ac.signal);clearInterval(tick);prog(92,'Inserisco gli accordi nel testo');
    const parsed=buildFromJSON(t);prog(100,'Fatto');
    closeModal();S.tab='lib';S.sel=null;S.edit={isNew:true,fromPhoto:true,title:parsed.title,author:parsed.author,body:parsed.body};S.view='detail';render();
    toast('Controlla il testo prima di salvare: la lettura può sbagliare')
  }catch(e){clearInterval(tick);if(ac.signal.aborted)return;
    const st=e&&e.status;const d=(e&&e.detail)||(e&&e.message)||String(e);
    const why=st===429?'Hai superato il limite gratuito di Google: riprova tra qualche minuto.':(st===400||st===401||st===403)?'La chiave Gemini non è stata accettata: controllala nelle Impostazioni.':'La lettura non è riuscita. Se la foto è nitida e dritta, mandami il dettaglio qui sotto.';
    modal('Lettura non riuscita','<p>'+esc(why)+'</p><p class="hint" style="word-break:break-word"><b>Dettaglio:</b> '+esc(d)+'</p>','<button class="btn pri" data-act="mclose">Chiudi</button>')}}

   +('<div class="editonly"><p style="margin:16px 0 6px;font-weight:600">Lettura da foto (Gemini)</p><p class="hint">Incolla qui la tua chiave gratuita, creata su aistudio.google.com \u2192 \u201CGet API key\u201D. Resta salvata solo su questo dispositivo.</p><div class="form" style="padding:0"><label>Chiave<input type="password" id="gk" value="'+esc(LS.get('gkey',''))+'" autocomplete="off" placeholder="AIza\u2026"></label></div></div>')
   +'<p class="hint editonly" style="margin-top:14px">Copia di sicurezza: scarica tutti i canti e le scalette in un file, o ricaricali da un file salvato prima.</p>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Scarica copia</button><label class="btn editonly" style="cursor:pointer">Ripristina da file<input type="file" id="imp" accept=".json,application/json" hidden></label></div>','<button class="btn pri" data-act="mclose">Fatto</button>');
  if($('#gk'))$('#gk').addEventListener('change',e=>{LS.set('gkey',e.target.value.trim());LS.set('gmodel',null);toast('Chiave salvata')});
  if($('#imp'))$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());let n=0;for(const s of d.songs||[]){if(s.id&&s.title){await saveSong(s);n++}}for(const s of d.sets||[]){if(s.id&&s.name){await saveSet(s)}}closeModal();render();toast('Ripristinati '+n+' canti')}catch(err){toast('File non valido')}})}

/* ---------- scorrimento a sinistra per eliminare ---------- */
(function(){
  let st=null,swallow=false;
  const closeAll=except=>document.querySelectorAll('li.sw.open').forEach(l=>{if(l!==except)l.classList.remove('open')});
  document.addEventListener('pointerdown',e=>{
    const li=e.target.closest&&e.target.closest('li.sw');
    if(!li||!S.canEdit||e.target.closest('.swdel')){if(!e.target.closest||!e.target.closest('.swdel'))closeAll(null);return}
    closeAll(li);st={li,x:e.clientX,y:e.clientY,open:li.classList.contains('open'),moved:false,dir:null,id:e.pointerId}});
  document.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;st.dir=Math.abs(dx)>Math.abs(dy)*1.3?'h':'v';if(st.dir==='v'){st=null;return}st.li.classList.add('drag');try{st.li.setPointerCapture(e.pointerId)}catch(_){}}
    st.moved=true;const base=st.open?-96:0;const x=Math.max(-110,Math.min(0,base+dx));
    st.li.querySelector('.row').style.transform='translateX('+x+'px)'});
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;const li=st.li;
    if(st.moved){const row=li.querySelector('.row');const m=/-?[\d.]+/.exec(row.style.transform);const x=m?parseFloat(m[0]):0;
      li.classList.remove('drag');row.style.transform='';li.classList.toggle('open',x<-48);swallow=true;setTimeout(()=>swallow=false,350)}
    st=null};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',e=>{if(swallow&&e.target.closest&&e.target.closest('li.sw')&&!e.target.closest('.swdel')){e.stopPropagation();e.preventDefault()}},true);
})();
/* ---------- azioni ---------- */
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#listBody').innerHTML=listItems()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='photoIn'){const f=[...t.files];t.value='';if(f.length)fromPhotos(f)}
  if(t.dataset&&t.dataset.act==='lbl'){const s=S.sets.find(x=>x.id===S.selSet);s.items[+t.dataset.i].label=t.value.trim();await saveSet(s)}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,d=+b.dataset.d,i=+b.dataset.i;
  const song=S.songs.find(s=>s.id===S.sel),set=S.sets.find(s=>s.id===S.selSet);
  switch(a){
  case'tab':S.tab=b.dataset.v;S.view='list';S.edit=null;render();break;
  case'open':S.sel=b.dataset.id;S.tr=0;S.view='detail';S.edit=null;render();break;
  case'back':S.view='list';S.edit=null;render();break;
  case'new':S.edit={isNew:true,title:'',author:'',body:''};S.view='detail';render();break;
  case'edit':S.edit={...song};render();break;
  case'cancel':S.edit=null;S.view=S.sel?'detail':'list';render();break;
  case'convert':{const el=$('#e-body');el.value=normalizeBody(el.value);el.dispatchEvent(new Event('input'));toast('Accordi spostati dentro il testo');break}
  case'save':{const ed=S.edit;ed.title=($('#e-title').value||'').trim();ed.author=$('#e-author').value.trim();ed.body=normalizeBody($('#e-body').value);
    if(!ed.title){toast('Scrivi un titolo');return}if(!ed.body.trim()){toast('Il canto è vuoto');return}
    const o={id:ed.id||uid(),title:ed.title,author:ed.author,body:ed.body,tags:ed.tags||[],capo:ed.capo||0,key:keyLabel({body:ed.body},0,'auto'),example:false};
    await saveSong(o);S.sel=o.id;S.edit=null;S.view='detail';S.tr=0;render();toast('Canto salvato');break}
  case'swdel':{const sg=S.songs.find(x=>x.id===b.dataset.id);if(!sg)break;
    ask('Eliminare questo canto?','\u201C'+sg.title+'\u201D verr\u00E0 eliminato per tutto il coro, anche dalle scalette. L\u2019operazione non si pu\u00F2 annullare.','Elimina',async()=>{S.songs=S.songs.filter(x=>x.id!==sg.id);await unpersist('songs',sg.id);if(S.sel===sg.id){S.sel=null;S.view='list'}S.edit=null;render();toast('Canto eliminato')},true);break}
  case'delsong':ask('Eliminare questo canto?','“'+song.title+'” sparirà dalla libreria e dalle scalette.','Elimina',async()=>{S.songs=S.songs.filter(x=>x.id!==song.id);await unpersist('songs',song.id);S.sel=null;S.edit=null;S.view='list';render()},true);break;
  case'photo':{let inp=$('#photoIn');if(!inp){inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.id='photoIn';inp.hidden=true;document.body.appendChild(inp)}inp.click();break}
  case'fm':S.fm=b.dataset.v;render();break;
  case'heroopen':S.tab='set';S.selSet=b.dataset.id;S.view='detail';S.edit=null;render();break;
  case'heropres':{const hs=S.sets.find(x=>x.id===b.dataset.id);if(hs)openPres(hs.items,0,hs.name);break}
  case'theme':S.theme=b.dataset.v;LS.set('theme',S.theme);applyLook();document.querySelectorAll('#spt button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.theme));document.querySelectorAll('#spa button').forEach(x=>{const a=ACC[x.dataset.v];x.style.background=isDark()?a.d:a.l;x.style.color=dk2ink(a)});break;
  case'accent':S.accent=b.dataset.v;LS.set('accent',S.accent);applyLook();document.querySelectorAll('#spa button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.accent));break;
  case'idx':S.idx=b.dataset.v;LS.set('idx',S.idx);render();break;
  case'tag':{const t=b.dataset.t,a2=S.edit.tags=S.edit.tags||[];const k=a2.indexOf(t);k<0?a2.push(t):a2.splice(k,1);b.setAttribute('aria-pressed',k<0);break}
  case'capo':song.capo=Math.max(0,Math.min(11,(song.capo||0)+d));await saveSong(song);render();break;
  case'tr':S.tr+=d;render();break;
  case'tr0':S.tr=0;render();break;
  case'fs':S.fs=Math.max(14,Math.min(48,S.fs+d));LS.set('fs',S.fs);render();break;
  case'pres1':openPres([{sid:song.id,tr:S.tr}],0,'');break;
  case'addset':{
    const opts=sortedSets();
    modal('Aggiungi a una scaletta',(opts.length?'<ul class="list">'+opts.map(s=>'<li><button class="row" data-act="addto" data-id="'+s.id+'"><span class="grow"><span class="t">'+esc(s.name)+'</span><span class="s">'+esc(fmtDate(s.date))+'</span></span></button></li>').join('')+'</ul>':'<p>Non hai ancora scalette.</p>'),'<button class="btn" data-act="mclose">Chiudi</button><button class="btn pri" data-act="addtonew">Nuova scaletta</button>');break}
  case'addto':{const s=S.sets.find(x=>x.id===b.dataset.id);s.items.push({sid:song.id,tr:S.tr,capo:song.capo||0,label:''});await saveSet(s);closeModal();toast('Aggiunto a “'+s.name+'”');break}
  case'addtonew':{const s={id:uid(),type:'standard',name:'Nuova scaletta',date:new Date().toISOString().slice(0,10),items:[{sid:song.id,tr:S.tr,capo:song.capo||0,label:''}]};await saveSet(s);closeModal();S.tab='set';S.selSet=s.id;S.view='detail';render();break}
  case'mclose':closeModal();break;
  case'settings':settings();break;
  case'login':{const m=($('#lg-mail').value||'').trim(),p=$('#lg-pw').value;if(!m||!p){toast('Scrivi email e password');break}
    try{await S.auth.signInWithEmailAndPassword(m,p);closeModal();toast('Accesso effettuato')}catch(err){toast('Email o password non corretti')}break}
  case'logout':await S.auth.signOut();closeModal();toast('Sei uscito');break;
  case'pref':S.pref=b.dataset.v;LS.set('pref',S.pref);document.querySelectorAll('#sp button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.pref));render();break;
  case'export':{const blob=new Blob([JSON.stringify({version:1,songs:S.songs,sets:S.sets},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='icoro-copia.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
  /* scalette */
  case'openset':S.selSet=b.dataset.id;S.view='detail';render();break;
  case'newset':{modal('Nuova scaletta','<div class="form" style="padding:0"><label>Tipo<div class="chips" id="nt"><button data-act="ntype" data-v="messa" aria-pressed="true">Messa</button><button data-act="ntype" data-v="standard" aria-pressed="false">Scaletta standard</button></div></label><label>Nome<input type="text" id="n-name" value="Messa"></label><label>Data<input type="date" id="n-date" value="'+new Date().toISOString().slice(0,10)+'"></label></div>','<button class="btn" data-act="mclose">Annulla</button><button class="btn pri" id="nok">Crea</button>');
    S.nt='messa';$('#nok').onclick=async()=>{const s={id:uid(),type:S.nt,name:$('#n-name').value.trim()||TIPI[S.nt],date:$('#n-date').value,items:[]};closeModal();await saveSet(s);S.selSet=s.id;S.view='detail';render()};break}
  case'ntype':{S.nt=b.dataset.v;document.querySelectorAll('#nt button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.nt));const nm=$('#n-name');if(nm&&(nm.value==='Messa'||nm.value==='Scaletta standard'||!nm.value))nm.value=TIPI[S.nt];break}
  case'dupset':{const c={...set,id:uid(),name:set.name+' (copia)',example:false,items:set.items.map(x=>({...x}))};await saveSet(c);S.selSet=c.id;render();break}
  case'delset':ask('Eliminare la scaletta?','“'+set.name+'” verrà eliminata. I canti restano nella libreria.','Elimina',async()=>{S.sets=S.sets.filter(x=>x.id!==set.id);await unpersist('setlists',set.id);S.selSet=null;S.view='list';render()},true);break;
  case'pickadd':pickSongs(async ids=>{ids.forEach(id=>{const sg=S.songs.find(x=>x.id===id);set.items.push({sid:id,tr:0,capo:(sg&&sg.capo)||0,label:''})});await saveSet(set);render()});break;
  case'rm':set.items.splice(i,1);await saveSet(set);render();break;
  case'up':case'dn':{const j=a==='up'?i-1:i+1;if(j<0||j>=set.items.length)break;[set.items[i],set.items[j]]=[set.items[j],set.items[i]];await saveSet(set);render();break}
  case'icapo':set.items[i].capo=Math.max(0,Math.min(11,(set.items[i].capo||0)+d));await saveSet(set);render();break;
  case'itr':set.items[i].tr=(set.items[i].tr||0)+d;await saveSet(set);render();break;
  case'presset':openPres(set.items,0,set.name);break;
  /* presentazione */
  case'pclose':closePres();break;
  case'pnext':pgo(1);break;case'pprev':pgo(-1);break;
  case'ptr':S.pres.list[S.pres.i].tr+=d;drawPres();break;
  case'ptr0':S.pres.list[S.pres.i].tr=0;drawPres();break;
  case'pfs':S.pres.fs=Math.max(16,Math.min(64,S.pres.fs+d));drawPres();break;
  case'pindex':{const p=S.pres;modal('Indice',  '<ul class="list">'+p.list.map((x,k)=>'<li><button class="row" data-act="pjump" data-i="'+k+'" '+(k===p.i?'aria-current="true"':'')+'><span class="grow"><span class="t">'+(k+1)+'. '+esc(x.song.title)+'</span><span class="s">'+esc(x.label)+'</span></span></button></li>').join('')+'</ul>','<button class="btn" data-act="mclose">Chiudi</button>');break}
  case'pjump':closeModal();S.pres.i=i;drawPres();break;
  }});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- avvio ---------- */
if(!HAS_FB)seed();setEyebrow();render();
(function(){
  if(!HAS_FB){setSync();return}
  firebase.initializeApp(CFG);
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  S.db=db;S.auth=firebase.auth();S.canEdit=false;document.body.classList.add('ro');
  S.auth.onAuthStateChanged(u=>{S.user=u;S.canEdit=!!u;document.body.classList.toggle('ro',!u);setSync();
    if(!S.edit&&!S.pres&&!$('#modal').classList.contains('on'))render()});
  setSync();
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(snap.metadata.fromCache&&!docs.length)return;
    S[key]=docs;S.online=!snap.metadata.fromCache||S.online;cache();
    if(S.sel&&!S.songs.find(x=>x.id===S.sel))S.sel=null;
    if(S.selSet&&!S.sets.find(x=>x.id===S.selSet))S.selSet=null;
    if(!S.edit&&!S.pres&&!$('#modal').classList.contains('on')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render();else setSync()},
    err=>{S.online=false;setSync()});
  sub('songs','songs');sub('setlists','sets');
  window.addEventListener('online',()=>{S.online=true;setSync()});window.addEventListener('offline',()=>{S.online=false;setSync()});
})();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
