<style>
/* Layout: due colonne su iPad (elenco a sinistra, canto a destra), una colonna su telefono. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface2:#e9ebe6; --ink:#1b2130; --muted:#5d6577; --line:#d6d9d2;
  --accent:#2f43b5; --accent-ink:#ffffff; --accent-soft:#e3e7fb; --danger:#a8321f;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b2030; --surface2:#242a3b; --ink:#e8eaf2; --muted:#9aa2b6; --line:#2e3547;
  --accent:#93a2ff; --accent-ink:#10142b; --accent-soft:#272e57; --danger:#ff8f7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b2030; --surface2:#242a3b; --ink:#e8eaf2; --muted:#9aa2b6; --line:#2e3547;
  --accent:#93a2ff; --accent-ink:#10142b; --accent-soft:#272e57; --danger:#ff8f7a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto}
header.top{display:flex;align-items:center;gap:16px;padding:12px 0 10px;flex-wrap:wrap}
.brand{font:600 22px/1 var(--text);letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font:500 11px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}

.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pane-h{padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pane-b{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
textarea{font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:320px;resize:vertical}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;min-height:56px}
.row[aria-current="true"]{background:var(--accent-soft)}

.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.ctl .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.key{font:700 18px var(--ui);min-width:64px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:40px;min-width:44px;padding:0 10px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.sheet .meta{font:14px var(--ui);color:var(--muted);margin-bottom:16px}
.ln{margin:0 0 .5em;overflow-wrap:anywhere}
.sg{display:inline-flex;flex-direction:column;vertical-align:bottom}
.ch{font:700 .82em/1.5 var(--ui);color:var(--accent);padding-right:.45em;min-height:1.5em;white-space:pre}
.tx{white-space:pre-wrap}
.ln.plain{line-height:1.45}
.gap{height:.9em}
.capo{display:inline-block;font:700 .62em/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:.5em .75em;margin:0 0 1.2em}
.grp{position:sticky;top:0;z-index:1;background:var(--surface2);font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 14px}
.list li.grp{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;min-height:48px}
.opt input{width:22px;height:22px;margin-top:2px}
.sec{font:700 .62em/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.1em 0 .6em}
.form{padding:14px;display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.items li{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.items .n{font:600 14px var(--ui);color:var(--muted);width:22px;text-align:right}
.items .grow{flex:1;min-width:0}
.items .t{font:600 17px/1.25 var(--text)}
.items input[type=text]{min-height:34px;padding:2px 8px;font-size:13px;margin-top:4px;max-width:240px}
.mini{display:flex;gap:4px;align-items:center}
.mini .btn{min-height:38px;min-width:38px;padding:0 8px;justify-content:center}
.back{display:none}
#modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px))}
#modal.on{display:flex}
.card{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){#modal{align-items:center}}
.card h3{margin:0;padding:16px 18px 8px;font:600 20px var(--text)}
.card .cb{padding:6px 18px 12px;overflow:auto}
.card .cf{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);flex-wrap:wrap}
.pick li{display:flex;gap:12px;align-items:center;padding:6px 0;min-height:48px}
.pick input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw}
#toast.on{opacity:1}
/* presentazione */
#pres{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#pres.on{display:flex}
.pres-h{display:flex;gap:8px;align-items:center;padding:8px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pres-h .ttl{flex:1;min-width:140px;font:600 20px/1.2 var(--text)}
.pres-h .ttl small{display:block;font:500 12px var(--ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pres-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pres-b .sheet{max-width:980px;margin:0 auto}
.pres-f{display:flex;gap:8px;padding:8px 0;align-items:center;border-top:1px solid var(--line)}
.pres-f .btn{flex:1;justify-content:center;min-height:52px}
.pres-f .pos{font:600 14px var(--ui);color:var(--muted);min-width:56px;text-align:center}
@media(max-width:860px){
  main{grid-template-columns:1fr}
  main[data-view="detail"] .pane.listp{display:none}
  main[data-view="list"] .pane.detailp{display:none}
  .back{display:inline-flex}
  .edit-grid{grid-template-columns:1fr}
  .tools{width:100%;justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ro [data-act="new"],.ro [data-act="edit"],.ro [data-act="addset"],.ro [data-act="newset"],.ro [data-act="pickadd"],.ro [data-act="dupset"],.ro [data-act="delset"],.ro [data-act="rm"],.ro [data-act="up"],.ro [data-act="dn"],.ro [data-act="delsong"],.ro .editonly{display:none!important}

<body>

<div class="app">
  <header class="top">
    <div class="brand">iCoro<small>Repertorio e scalette</small></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-act="tab" data-v="lib" id="tab-lib">Libreria</button>
      <button role="tab" data-act="tab" data-v="set" id="tab-set">Scalette</button>
    </div>
    <div class="tools">
      <span class="sync" id="sync"></span>
      <button class="btn sm" data-act="settings">Impostazioni</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="pres" aria-live="polite"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ---------- accordi ---------- */
const IT=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const ITb=['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];
const EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENb=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ROOT={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11,DO:0,RE:2,MI:4,FA:5,SOL:7,LA:9,SI:11,C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const R='(?:SOL|Sol|SI|Si|DO|Do|RE|Re|MI|Mi|FA|Fa|LA|La|[A-G])';
const CH=new RegExp('^('+R+')([#b♯♭]?)((?:maj|min|dim|aug|sus|add|m|M|\\+|-|°|ø|\\d|[#b]|\\(|\\))*)(?:/('+R+')([#b♯♭]?))?$');
const FLATKEYS=[5,10,3,8,1];
const MOMENTI=['Ingresso','Atto penitenziale','Gloria','Salmo','Alleluia','Offertorio','Santo','Agnello di Dio','Comunione','Ringraziamento','Finale'];
const TEMPI=['Avvento','Natale','Quaresima','Pasqua','Pentecoste','Tempo ordinario','Maria','Santi'];
const TIPI={messa:'Messa',standard:'Scaletta standard'};
const capoHTML=n=>n>0?'<div class="capo">Capotasto al '+n+'° tasto</div>':'';
function parseChord(s){const m=CH.exec(s);if(!m)return null;
  const acc=x=>x==='#'||x==='♯'?1:(x==='b'||x==='♭'?-1:0);
  return{root:m[1],acc:acc(m[2]),suffix:m[3]||'',bass:m[4]||null,bacc:acc(m[5]||''),sys:/^(SOL|Sol|SI|Si|DO|Do|RE|Re|MI|Mi|FA|Fa|LA|La)$/.test(m[1])?'it':'en'};}
function idxOf(root,acc){return((ROOT[root]+acc)%12+12)%12}
function isMinor(p){return /^(m(?!aj)|min|-)/.test(p.suffix)}
function keyIndex(chord){const p=parseChord(chord);if(!p)return null;let i=idxOf(p.root,p.acc);return isMinor(p)?(i+3)%12:i}
function nameFor(i,sys,flats){return(sys==='it'?IT:EN)[((i%12)+12)%12]}
function shiftChord(str,n,sys,flats){const p=parseChord(str);if(!p)return str;
  let out=nameFor(idxOf(p.root,p.acc)+n,sys,flats)+p.suffix;
  if(p.bass)out+='/'+nameFor(idxOf(p.bass,p.bacc)+n,sys,flats);return out}
function firstChord(body){const re=/\[([^\]]+)\]/g;let m;while((m=re.exec(body))){if(parseChord(m[1].trim()))return m[1].trim()}return null}
function songSys(body){const c=firstChord(body);const p=c&&parseChord(c);return p?p.sys:'it'}
const TOKRE=/^(\(?)(.+?)([)….,]*)$/;
function tokInfo(x){const m=TOKRE.exec(x);if(!m||!CH.test(m[2]))return null;return{pre:m[1],core:m[2],post:m[3]}}
function isChordLine(l){if(!l.trim()||l.includes('['))return false;
  let t=l.trim().split(/\s+/);if(t.length>1&&/^[A-Za-zÀ-ÿ]+:$/.test(t[0]))t=t.slice(1);
  t=t.filter(x=>!/^[\/|]+$/.test(x));if(!t.length)return false;
  const ti=t.map(tokInfo);if(!ti.every(Boolean))return false;
  if(t.length>1)return true;const x=ti[0].core;return /[#b\d\/m\-+]/.test(x.slice(1))||/^[A-G]$/.test(x)&&x!=='E'||x.length>3}
const wrapTok=x=>{const i=tokInfo(x);return i?i.pre+'['+i.core+']'+i.post:x};
function normalizeBody(txt){const L=String(txt).replace(/\r/g,'').split('\n'),out=[];
  for(let i=0;i<L.length;i++){const l=L[i];
    if(isChordLine(l)){const toks=[...l.matchAll(/\S+/g)].filter(m=>tokInfo(m[0]));const nx=L[i+1];
      if(nx!==undefined&&nx.trim()&&!isChordLine(nx)&&!nx.includes('[')&&!/^\s*#/.test(nx)){
        let s=nx;for(let k=toks.length-1;k>=0;k--){const pos=toks[k].index;if(s.length<pos)s=s.padEnd(pos,' ');s=s.slice(0,pos)+wrapTok(toks[k][0])+s.slice(pos)}
        out.push(s);i++;continue}
      out.push(l.trim().replace(/\s+/g,' ').replace(/\S+/g,wrapTok));continue}
    out.push(l)}
  return out.join('\n')}
/* tonalità mostrata dopo la trasposizione */
function keyLabel(song,n,pref){const c=firstChord(song.body);if(!c)return song.key||'';
  const sys=pref==='auto'?songSys(song.body):pref;const ki=keyIndex(c);
  const flats=FLATKEYS.includes((ki+n+120)%12);return shiftChord(c,n,sys,flats)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sheetHTML(song,n,pref){
  const first=firstChord(song.body);const sys=pref==='auto'?songSys(song.body):pref;
  const ki=first?keyIndex(first):0;const flats=FLATKEYS.includes((ki+n+120)%12);
  const lines=String(song.body||'').replace(/\r/g,'').split('\n');
  return lines.map(line=>{
    if(/^\s*#/.test(line))return'<div class="sec">'+esc(line.replace(/^\s*#+\s*/,''))+'</div>';
    if(!line.trim())return'<div class="gap"></div>';
    const re=/\[([^\]]*)\]/g;const segs=[];let last=0,m,cur={c:'',t:''};
    while((m=re.exec(line))){cur.t=line.slice(last,m.index);segs.push(cur);cur={c:m[1].trim(),t:''};last=m.index+m[0].length}
    cur.t=line.slice(last);segs.push(cur);
    if(segs.length===1&&!segs[0].c)return'<div class="ln plain">'+esc(line)+'</div>';
    return'<div class="ln">'+segs.filter((s,i)=>s.c||s.t||i===0&&segs.length===1).map(s=>{
      const c=s.c?esc(shiftChord(s.c,n,sys,flats)):'';
      return'<span class="sg"><span class="ch">'+(c||'&nbsp;')+'</span><span class="tx">'+(esc(s.t)||(s.c?'&nbsp;':''))+'</span></span>'}).join('')+'</div>'
  }).join('')}

/* ---------- stato e archivio ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={songs:[],sets:[],tab:'lib',sel:null,selSet:null,q:'',view:'list',edit:null,tr:0,
  fs:LS.get('fs',20),idx:LS.get('idx','az'),pref:LS.get('pref','auto'),db:null,auth:null,user:null,canEdit:true,online:false,pres:null};
const CFG=window.FIREBASE_CONFIG,HAS_FB=!!(CFG&&CFG.apiKey&&!/INCOLLA/i.test(CFG.apiKey)&&window.firebase);
S.songs=LS.get('songs',[]);S.sets=LS.get('sets',[]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function cache(){LS.set('songs',S.songs);LS.set('sets',S.sets)}
function setSync(){$('#sync').textContent=S.db?(S.canEdit?(S.online?'Editor \u00B7 sincronizzato':'Editor \u00B7 in attesa di rete'):(S.online?'Sola lettura':'Sola lettura \u00B7 offline')):'Solo su questo dispositivo'}
async function persist(kind,obj){
  cache();
  if(!S.db||!S.canEdit)return;
  try{await S.db.collection(kind).doc(obj.id).set(obj);S.online=true}
  catch(e){S.online=false;toast('Non sono riuscito a salvare online: controlla l\u2019accesso e la rete')}
  setSync()}
async function unpersist(kind,id){cache();if(!S.db||!S.canEdit)return;try{await S.db.collection(kind).doc(id).delete()}catch(e){toast('Eliminazione online non riuscita')}}
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i<0)arr.push(o);else arr[i]=o}
const saveSong=async s=>{s.updated=Date.now();upsert(S.songs,s);await persist('songs',s)};
const saveSet=async s=>{s.updated=Date.now();upsert(S.sets,s);await persist('setlists',s)};

/* ---------- dati di esempio ---------- */
function seed(){
  if(LS.get('seeded',false)||S.songs.length||S.sets.length)return;LS.set('seeded',true);
  const a={id:uid(),title:'Tu scendi dalle stelle',author:'Sant’Alfonso de’ Liguori (1754)',key:'Do',example:true,
   body:'# Strofa\n[Do]Tu scendi dalle [Fa]stelle, o [Do]Re del [Sol7]cielo,\ne [Do]vieni in una [Fa]grotta al freddo e al [Sol7]gelo.\n\n# Ritornello\nO [Do]Bambino mio di[Fa]vino,\nio ti [Do]vedo qui a tre[Sol7]mar;\no [Do]Dio be[Fa]ato! [Sol7]\nAh, quanto ti co[Do]stò l’avermi a[Fa]mato! [Do]'};

function listItems(){const L=songsFiltered();
  if(!S.songs.length)return'<div class="empty"><b>La libreria \u00E8 vuota</b>Se sei un editor, accedi da Impostazioni e aggiungi il primo canto con \u201CNuovo canto\u201D o \u201CDa foto\u201D.</div>';
  if(!L.length)return'<div class="empty"><b>Nessun risultato</b>Prova con un\u2019altra parola del titolo o del testo.</div>';
  const groups=[];

  else{const names=S.idx==='momento'?MOMENTI:TEMPI;
    names.forEach(n=>{const g=L.filter(x=>(x.tags||[]).includes(n));if(g.length)groups.push([n,g])});
    const rest=L.filter(x=>!(x.tags||[]).some(t=>names.includes(t)));if(rest.length)groups.push([S.idx==='momento'?'Senza momento':'Senza tempo liturgico',rest])}

function pgo(d){const p=S.pres;const j=p.i+d;if(j<0||j>=p.list.length)return;p.i=j;drawPres()}

document.addEventListener('touchstart',e=>{if(S.pres&&$('#pres').classList.contains('on')&&e.target.closest('.pres-b'))tx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});

/* ---------- foto (lettura con Gemini) ---------- */
async function shrink(file){const bmp=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const b64=blob=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(blob)});
const GAPI='https://generativelanguage.googleapis.com/v1beta/';
async function listModels(key,force){
  let m=!force&&LS.get('gmodels',null);if(m&&m.length)return m;
  const r=await fetch(GAPI+'models?pageSize=200&key='+encodeURIComponent(key));
  if(!r.ok){throw await apiErr(r)}
  const list=((await r.json()).models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')&&/gemini-[\d.]+-flash/.test(x.name)&&!/lite|image|tts|live|audio|thinking|exp|8b|robotics|computer/.test(x.name));
  if(!list.length){const e=new Error('Nessun modello Gemini Flash disponibile con questa chiave');e.detail=e.message;throw e}
  const ver=x=>parseFloat((/gemini-([\d.]+)-flash/.exec(x.name)||[0,0])[1]);
  list.sort((a,b)=>ver(b)-ver(a)||(/preview/.test(a.name)-/preview/.test(b.name)));
  m=list.map(x=>x.name.replace(/^models\//,'')).slice(0,4);LS.set('gmodels',m);return m}
async function apiErr(r){let msg='';try{const j=await r.json();msg=(j.error&&j.error.message)||''}catch(e){}
  const e=new Error('http '+r.status);e.status=r.status;e.detail='Errore '+r.status+(msg?': '+msg.slice(0,160):'');return e}
async function gemini(key,parts,signal){
  let last=null;
  for(let round=0;round<2;round++){
    const models=await listModels(key,round>0);
    for(const model of models.slice(0,3)){
      try{
        const r=await fetch(GAPI+'models/'+model+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0}})});
        if(!r.ok){const e=await apiErr(r);if([400,401,403,429].includes(e.status))throw e;last=e;continue}
        const j=await r.json();const c=(j.candidates||[])[0];const t=c&&c.content&&c.content.parts;
        const txt=t?t.map(p=>p.text||'').join('').trim():'';
        if(!txt){last=new Error('vuota');last.detail='Risposta vuota ('+((c&&c.finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||'nessun motivo')+') dal modello '+model;continue}
        return txt
      }catch(e){if(e.name==='AbortError'||e.status)throw e;last=e;last.detail=last.detail||'Connessione non riuscita: '+(e.message||e)}
    }
    LS.set('gmodels',null)}
  throw last||new Error('sconosciuto')}
async function fromPhotos(files){
  const key=LS.get('gkey','');
  if(!key){toast('Prima inserisci la chiave Gemini nelle Impostazioni');settings();return}
  modal('Sto leggendo la pagina','<p>Trascrivo testo e accordi dalla foto. Ci vuole qualche decina di secondi.</p>','<button class="btn" id="pabort">Annulla</button>');
  const ac=new AbortController();$('#pabort').onclick=()=>{ac.abort();closeModal()};
  try{
    const parts=[];
    const prompt='Ti allego la foto di una o più pagine di un libro di canti per la chiesa, con testo e accordi. Trascrivi il canto in formato ChordPro: ogni accordo tra parentesi quadre subito prima della sillaba su cui cade, scritto esattamente come nel libro, anche in maiuscolo (per esempio [RE], [SOL], [SI-], [LA4], oppure [Do], [Lam], [C], [Am]). Un accordo scritto tra parentesi nel libro, come (RE), diventa ([RE]). Rispondi solo così, senza commenti:\nTITOLO: <titolo>\nAUTORE: <autore se indicato, altrimenti vuoto>\n---\n<corpo>\nRegole per il corpo: se sotto il titolo c’è una riga con tempo o tonalità (per esempio 6/8 - Largo in Re Maggiore) scrivila come prima riga, senza accordi. Le etichette di sezione come Ritornello o Strumentale vanno su una riga a sé che inizia con # (per esempio # Ritornello, # Strumentale); le righe di soli accordi di intro e strumentale vanno subito sotto, con gli accordi tra parentesi quadre separati da spazio o da / come nel libro. Una riga vuota tra le strofe. Il testo delle parole va copiato fedelmente, con le maiuscole e minuscole normali di una frase. Non inventare e non correggere nulla: se una parola o un accordo non è leggibile scrivi [?]. Se nella foto c’è più di un canto, trascrivi solo il primo.';
    parts.push({text:prompt});
    for(const f of [...files].slice(0,3)){let bl;try{bl=await shrink(f)}catch(er){const x=new Error('foto');x.detail='Non riesco ad aprire la foto ('+(f.type||'formato sconosciuto')+'). Prova a scattarla di nuovo o a scegliere un JPEG.';throw x}parts.push({inline_data:{mime_type:'image/jpeg',data:await b64(bl)}})}
    const t=await gemini(key,parts,ac.signal);
    const mt=/TITOLO:\s*(.*)/i.exec(t),ma=/AUTORE:\s*(.*)/i.exec(t);const body=t.split(/\n---+\s*\n/).slice(1).join('\n---\n').trim()||t;
    closeModal();S.tab='lib';S.sel=null;S.edit={isNew:true,fromPhoto:true,title:(mt&&mt[1].trim().replace(/^<|>$/g,''))||'',author:(ma&&ma[1].trim().replace(/^<|>$/g,''))||'',body:normalizeBody(body)};S.view='detail';render();
    toast('Controlla il testo prima di salvare: la lettura può sbagliare')
  }catch(e){if(ac.signal.aborted)return;
    const st=e&&e.status;const d=(e&&e.detail)||(e&&e.message)||String(e);
    const why=st===429?'Hai superato il limite gratuito di Google: riprova tra qualche minuto.':(st===400||st===401||st===403)?'La chiave Gemini non è stata accettata: controllala nelle Impostazioni.':'La lettura non è riuscita. Se la foto è nitida e dritta, mandami il dettaglio qui sotto.';
    modal('Lettura non riuscita','<p>'+esc(why)+'</p><p class="hint" style="word-break:break-word"><b>Dettaglio:</b> '+esc(d)+'</p>','<button class="btn pri" data-act="mclose">Chiudi</button>')}}

/* ---------- impostazioni e backup ---------- */
function settings(){
  modal('Impostazioni','<p style="margin:0 0 6px;font-weight:600">Nomi degli accordi</p><div class="seg" id="sp"><button data-act="pref" data-v="auto" aria-pressed="'+(S.pref==='auto')+'">Come nel libro</button><button data-act="pref" data-v="it" aria-pressed="'+(S.pref==='it')+'">Do Re Mi</button><button data-act="pref" data-v="en" aria-pressed="'+(S.pref==='en')+'">C D E</button></div>'
   +(S.db?'<p style="margin:16px 0 6px;font-weight:600">Accesso editor</p>'+(S.user?'<p class="hint">Sei dentro come '+esc(S.user.email)+'. Puoi modificare canti e scalette per tutto il coro.</p><button class="btn" data-act="logout">Esci</button>':'<p class="hint">Solo chi cura il repertorio ha bisogno di accedere. Tutti gli altri leggono e basta.</p><div class="form" style="padding:0"><label>Email<input type="email" id="lg-mail" autocomplete="username"></label><label>Password<input type="password" id="lg-pw" autocomplete="current-password"></label></div><button class="btn pri" data-act="login" style="margin-top:8px">Accedi</button>'):'')
   +('<div class="editonly"><p style="margin:16px 0 6px;font-weight:600">Lettura da foto (Gemini)</p><p class="hint">Incolla qui la tua chiave gratuita, creata su aistudio.google.com \u2192 \u201CGet API key\u201D. Resta salvata solo su questo dispositivo.</p><div class="form" style="padding:0"><label>Chiave<input type="password" id="gk" value="'+esc(LS.get('gkey',''))+'" autocomplete="off" placeholder="AIza\u2026"></label></div></div>')
   +'<p class="hint editonly" style="margin-top:14px">Copia di sicurezza: scarica tutti i canti e le scalette in un file, o ricaricali da un file salvato prima.</p>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Scarica copia</button><label class="btn editonly" style="cursor:pointer">Ripristina da file<input type="file" id="imp" accept=".json,application/json" hidden></label></div>','<button class="btn pri" data-act="mclose">Fatto</button>');
  if($('#gk'))$('#gk').addEventListener('change',e=>{LS.set('gkey',e.target.value.trim());LS.set('gmodel',null);toast('Chiave salvata')});
  if($('#imp'))$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());let n=0;for(const s of d.songs||[]){if(s.id&&s.title){await saveSong(s);n++}}for(const s of d.sets||[]){if(s.id&&s.name){await saveSet(s)}}closeModal();render();toast('Ripristinati '+n+' canti')}catch(err){toast('File non valido')}})}

/* ---------- azioni ---------- */
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#listBody').innerHTML=listItems()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='photoIn'){const f=[...t.files];t.value='';if(f.length)fromPhotos(f)}
  if(t.dataset&&t.dataset.act==='lbl'){const s=S.sets.find(x=>x.id===S.selSet);s.items[+t.dataset.i].label=t.value.trim();await saveSet(s)}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,d=+b.dataset.d,i=+b.dataset.i;
  const song=S.songs.find(s=>s.id===S.sel),set=S.sets.find(s=>s.id===S.selSet);
  switch(a){
  case'tab':S.tab=b.dataset.v;S.view='list';S.edit=null;render();break;
  case'open':S.sel=b.dataset.id;S.tr=0;S.view='detail';S.edit=null;render();break;
  case'back':S.view='list';S.edit=null;render();break;
  case'new':S.edit={isNew:true,title:'',author:'',body:''};S.view='detail';render();break;
  case'edit':S.edit={...song};render();break;
  case'cancel':S.edit=null;S.view=S.sel?'detail':'list';render();break;
  case'convert':{const el=$('#e-body');el.value=normalizeBody(el.value);el.dispatchEvent(new Event('input'));toast('Accordi spostati dentro il testo');break}
  case'save':{const ed=S.edit;ed.title=($('#e-title').value||'').trim();ed.author=$('#e-author').value.trim();ed.body=normalizeBody($('#e-body').value);
    if(!ed.title){toast('Scrivi un titolo');return}if(!ed.body.trim()){toast('Il canto è vuoto');return}
    const o={id:ed.id||uid(),title:ed.title,author:ed.author,body:ed.body,tags:ed.tags||[],capo:ed.capo||0,key:keyLabel({body:ed.body},0,'auto'),example:false};
    await saveSong(o);S.sel=o.id;S.edit=null;S.view='detail';S.tr=0;render();toast('Canto salvato');break}
  case'delsong':ask('Eliminare questo canto?','“'+song.title+'” sparirà dalla libreria e dalle scalette.','Elimina',async()=>{S.songs=S.songs.filter(x=>x.id!==song.id);await unpersist('songs',song.id);S.sel=null;S.edit=null;S.view='list';render()},true);break;
  case'photo':{let inp=$('#photoIn');if(!inp){inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.id='photoIn';inp.hidden=true;document.body.appendChild(inp)}inp.click();break}
  case'idx':S.idx=b.dataset.v;LS.set('idx',S.idx);render();break;
  case'tag':{const t=b.dataset.t,a2=S.edit.tags=S.edit.tags||[];const k=a2.indexOf(t);k<0?a2.push(t):a2.splice(k,1);b.setAttribute('aria-pressed',k<0);break}
  case'capo':song.capo=Math.max(0,Math.min(11,(song.capo||0)+d));await saveSong(song);render();break;
  case'tr':S.tr+=d;render();break;
  case'tr0':S.tr=0;render();break;
  case'fs':S.fs=Math.max(14,Math.min(48,S.fs+d));LS.set('fs',S.fs);render();break;
  case'pres1':openPres([{sid:song.id,tr:S.tr}],0,'');break;
  case'addset':{
    const opts=sortedSets();
    modal('Aggiungi a una scaletta',(opts.length?'<ul class="list">'+opts.map(s=>'<li><button class="row" data-act="addto" data-id="'+s.id+'"><span class="grow"><span class="t">'+esc(s.name)+'</span><span class="s">'+esc(fmtDate(s.date))+'</span></span></button></li>').join('')+'</ul>':'<p>Non hai ancora scalette.</p>'),'<button class="btn" data-act="mclose">Chiudi</button><button class="btn pri" data-act="addtonew">Nuova scaletta</button>');break}
  case'addto':{const s=S.sets.find(x=>x.id===b.dataset.id);s.items.push({sid:song.id,tr:S.tr,capo:song.capo||0,label:''});await saveSet(s);closeModal();toast('Aggiunto a “'+s.name+'”');break}
  case'addtonew':{const s={id:uid(),type:'standard',name:'Nuova scaletta',date:new Date().toISOString().slice(0,10),items:[{sid:song.id,tr:S.tr,capo:song.capo||0,label:''}]};await saveSet(s);closeModal();S.tab='set';S.selSet=s.id;S.view='detail';render();break}
  case'mclose':closeModal();break;
  case'settings':settings();break;
  case'login':{const m=($('#lg-mail').value||'').trim(),p=$('#lg-pw').value;if(!m||!p){toast('Scrivi email e password');break}
    try{await S.auth.signInWithEmailAndPassword(m,p);closeModal();toast('Accesso effettuato')}catch(err){toast('Email o password non corretti')}break}
  case'logout':await S.auth.signOut();closeModal();toast('Sei uscito');break;
  case'pref':S.pref=b.dataset.v;LS.set('pref',S.pref);document.querySelectorAll('#sp button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.pref));render();break;
  case'export':{const blob=new Blob([JSON.stringify({version:1,songs:S.songs,sets:S.sets},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='icoro-copia.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
  /* scalette */
  case'openset':S.selSet=b.dataset.id;S.view='detail';render();break;
  case'newset':{modal('Nuova scaletta','<div class="form" style="padding:0"><label>Tipo<div class="chips" id="nt"><button data-act="ntype" data-v="messa" aria-pressed="true">Messa</button><button data-act="ntype" data-v="standard" aria-pressed="false">Scaletta standard</button></div></label><label>Nome<input type="text" id="n-name" value="Messa"></label><label>Data<input type="date" id="n-date" value="'+new Date().toISOString().slice(0,10)+'"></label></div>','<button class="btn" data-act="mclose">Annulla</button><button class="btn pri" id="nok">Crea</button>');
    S.nt='messa';$('#nok').onclick=async()=>{const s={id:uid(),type:S.nt,name:$('#n-name').value.trim()||TIPI[S.nt],date:$('#n-date').value,items:[]};closeModal();await saveSet(s);S.selSet=s.id;S.view='detail';render()};break}
  case'ntype':{S.nt=b.dataset.v;document.querySelectorAll('#nt button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.nt));const nm=$('#n-name');if(nm&&(nm.value==='Messa'||nm.value==='Scaletta standard'||!nm.value))nm.value=TIPI[S.nt];break}
  case'dupset':{const c={...set,id:uid(),name:set.name+' (copia)',example:false,items:set.items.map(x=>({...x}))};await saveSet(c);S.selSet=c.id;render();break}
  case'delset':ask('Eliminare la scaletta?','“'+set.name+'” verrà eliminata. I canti restano nella libreria.','Elimina',async()=>{S.sets=S.sets.filter(x=>x.id!==set.id);await unpersist('setlists',set.id);S.selSet=null;S.view='list';render()},true);break;
  case'pickadd':pickSongs(async ids=>{ids.forEach(id=>{const sg=S.songs.find(x=>x.id===id);set.items.push({sid:id,tr:0,capo:(sg&&sg.capo)||0,label:''})});await saveSet(set);render()});break;
  case'rm':set.items.splice(i,1);await saveSet(set);render();break;
  case'up':case'dn':{const j=a==='up'?i-1:i+1;if(j<0||j>=set.items.length)break;[set.items[i],set.items[j]]=[set.items[j],set.items[i]];await saveSet(set);render();break}
  case'icapo':set.items[i].capo=Math.max(0,Math.min(11,(set.items[i].capo||0)+d));await saveSet(set);render();break;
  case'itr':set.items[i].tr=(set.items[i].tr||0)+d;await saveSet(set);render();break;
  case'presset':openPres(set.items,0,set.name);break;
  /* presentazione */
  case'pclose':closePres();break;
  case'pnext':pgo(1);break;case'pprev':pgo(-1);break;
  case'ptr':S.pres.list[S.pres.i].tr+=d;drawPres();break;
  case'ptr0':S.pres.list[S.pres.i].tr=0;drawPres();break;
  case'pfs':S.pres.fs=Math.max(16,Math.min(64,S.pres.fs+d));drawPres();break;
  case'pindex':{const p=S.pres;modal('Indice',  '<ul class="list">'+p.list.map((x,k)=>'<li><button class="row" data-act="pjump" data-i="'+k+'" '+(k===p.i?'aria-current="true"':'')+'><span class="grow"><span class="t">'+(k+1)+'. '+esc(x.song.title)+'</span><span class="s">'+esc(x.label)+'</span></span></button></li>').join('')+'</ul>','<button class="btn" data-act="mclose">Chiudi</button>');break}
  case'pjump':closeModal();S.pres.i=i;drawPres();break;
  }});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- avvio ---------- */
if(!HAS_FB)seed();render();
(function(){
  if(!HAS_FB){setSync();return}
  firebase.initializeApp(CFG);
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  S.db=db;S.auth=firebase.auth();S.canEdit=false;document.body.classList.add('ro');
  S.auth.onAuthStateChanged(u=>{S.user=u;S.canEdit=!!u;document.body.classList.toggle('ro',!u);setSync();
    if(!S.edit&&!S.pres&&!$('#modal').classList.contains('on'))render()});
  setSync();
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(snap.metadata.fromCache&&!docs.length)return;
    S[key]=docs;S.online=!snap.metadata.fromCache||S.online;cache();
    if(S.sel&&!S.songs.find(x=>x.id===S.sel))S.sel=null;
    if(S.selSet&&!S.sets.find(x=>x.id===S.selSet))S.selSet=null;
    if(!S.edit&&!S.pres&&!$('#modal').classList.contains('on')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render();else setSync()},
    err=>{S.online=false;setSync()});
  sub('songs','songs');sub('setlists','sets');
  window.addEventListener('online',()=>{S.online=true;setSync()});window.addEventListener('offline',()=>{S.online=false;setSync()});
})();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
